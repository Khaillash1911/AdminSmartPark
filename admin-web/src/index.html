<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartPark Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" sizes="32x32" href="favicon.ico?v=20260820">
  <style>
    .boot-skeleton{position:fixed;inset:0;background:#f4f6f8;font-family:Arial,sans-serif;opacity:0;pointer-events:none;animation:boot-reveal .12s ease 280ms forwards}.boot-bar{height:64px;background:#1a237e;display:flex;align-items:center;padding:0 30px;color:#fff;font-size:22px;font-weight:700}.boot-body{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 64px)}.boot-nav{background:#fff;border-right:1px solid #e5e8ec;padding:28px 20px}.boot-content{padding:28px}.boot-shimmer{display:block;border-radius:8px;background:linear-gradient(90deg,#e3e7ed 25%,#f6f8fa 40%,#e3e7ed 65%);background-size:400% 100%;animation:boot-shimmer 1.35s ease-in-out infinite}.boot-nav .boot-shimmer{height:48px;margin-bottom:18px}.boot-title{width:340px;height:34px;margin-bottom:12px}.boot-subtitle{width:460px;max-width:80%;height:16px}.boot-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px}.boot-card{height:145px}.boot-panel{height:390px;margin-top:24px}@keyframes boot-reveal{to{opacity:1}}@keyframes boot-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}@media(max-width:900px){.boot-body{grid-template-columns:1fr}.boot-nav{display:none}.boot-cards{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.boot-skeleton{animation-duration:0s}.boot-shimmer{animation:none}}
  </style>
</head>
<body>
  <app-root>
    <div class="boot-skeleton" role="status" aria-label="Loading SmartPark Admin">
      <div class="boot-bar">SmartPark APU Admin</div>
      <div class="boot-body">
        <aside class="boot-nav"><span class="boot-shimmer"></span><span class="boot-shimmer"></span><span class="boot-shimmer"></span><span class="boot-shimmer"></span><span class="boot-shimmer"></span></aside>
        <main class="boot-content"><span class="boot-shimmer boot-title"></span><span class="boot-shimmer boot-subtitle"></span><div class="boot-cards"><span class="boot-shimmer boot-card"></span><span class="boot-shimmer boot-card"></span><span class="boot-shimmer boot-card"></span><span class="boot-shimmer boot-card"></span></div><span class="boot-shimmer boot-panel"></span></main>
      </div>
    </div>
  </app-root>
</body>
</html>
